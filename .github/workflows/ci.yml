name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (viz + app extras so the viz and Streamlit UI tests run)
        run: uv sync --extra viz --extra app

      - name: Ruff
        run: uv run ruff check src tests examples app.py

      - name: Pytest
        run: uv run pytest -q
